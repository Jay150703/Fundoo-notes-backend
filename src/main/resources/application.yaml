server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/fundoo_notes
    username: root
    password: roor  # change if needed
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update   # auto create/update tables
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  application:
    name: fundoo-notes

logging:
  level:
    org.springframework: INFO